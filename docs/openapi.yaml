openapi: 3.0.3
info:
  title: Prista Market Marketplace API
  version: 1.0.0
  description: "Versioned marketplace API under /api/v1.\n\nMoney is integer cents. Authentication is a bearer token returned by login. Authenticated calls are limited to 120 requests per 60 seconds. GET /api/v1/health is not limited. Checkout, payment, refund and payout require an Idempotency-Key header of 8 to 80 characters. The API does not accept raw card numbers or CVV values. live_provider_verified is always false until a real Mangopay sandbox call is recorded."
servers:
  -
    url: "http://localhost:8080"
    description: Local Docker shop
  -
    url: "https://staging.example.invalid"
    description: Staging placeholder. Not a live host.
tags:
  -
    name: Health
  -
    name: Authentication
  -
    name: Customers
  -
    name: Vendors
  -
    name: Shipping
  -
    name: Catalog
  -
    name: Offers
  -
    name: Inventory
  -
    name: Smart Cart
  -
    name: Checkout
  -
    name: Orders
  -
    name: Payments
  -
    name: Mangopay
  -
    name: Refunds
  -
    name: Payouts
  -
    name: Commissions
  -
    name: Invoices
  -
    name: Admin
  -
    name: CSV Imports
paths:
  /api/v1/health:
    get:
      tags:
        - Health
      operationId: health
      summary: Service health and payment-provider mode.
      description: "Permission health.read. Roles: public."
      responses:
        200:
          description: "Success envelope. List routes also return meta.page, meta.per_page and meta.total."
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                  meta:
                    $ref: "#/components/schemas/PageMeta"
        401:
          description: Authentication is missing or the webhook could not be verified.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        403:
          description: The account role or vendor scope does not allow this call.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        404:
          description: "The route or record was not found. Another customer's order is returned as 404."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        409:
          description: "The cart is infeasible, stock is insufficient, or the record conflicts."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        422:
          description: The request failed validation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        429:
          description: The caller exceeded 120 requests in 60 seconds.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
