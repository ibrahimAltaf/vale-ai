# PrestaShop stores the shopper session in one cookie. After catalog
# browsing that Cookie header grows past Apache's default 8 KB field limit.
LimitRequestFieldSize 65536
LimitRequestLine 16384
LimitRequestFields 200

# TLS ends at the Vale reverse proxy. Treat that forwarded request as HTTPS.
SetEnvIf X-Forwarded-Proto "^https$" HTTPS=on
